<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página não encontrada - Encurtador de Links</title>
  <link rel="stylesheet" href="./style.css" type="text/css" />
  <script>
    // Se a rota for /painel, /criar, /descriptografar etc., redireciona para a pasta correta
    const path = window.location.pathname;
    if (path.endsWith("/painel")) {
      window.location.replace(path + "/");
    } else if (path.endsWith("/criar")) {
      window.location.replace(path + "/");
    } else if (path.endsWith("/descriptografar")) {
      window.location.replace(path + "/");
    } else if (path.endsWith("/favoritos-ocultos")) {
      window.location.replace(path + "/");
    } else if (path.endsWith("/forca-bruta")) {
      window.location.replace(path + "/");
    }
  </script>
</head>
<body>
  <header class="site-header">
    <div class="header-container">
      <a href="./criar" class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <span>Encurtador de Links</span>
      </a>
      <nav>
        <ul class="nav-links">
          <li><a href="./criar" class="nav-link">Criar Link</a></li>
          <li><a href="./painel" class="nav-link">Painel</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="main-content" style="text-align: center; padding: 4rem 1rem;">
    <div class="card" style="max-width: 500px; margin: 0 auto;">
      <h1 style="font-size: 3rem; color: var(--accent-primary); margin-bottom: 0.5rem;">404</h1>
      <h2 style="font-size: 1.25rem; margin-bottom: 1rem;">Página não encontrada</h2>
      <p style="color: var(--text-secondary); margin-bottom: 1.5rem;">O endereço acessado não existe ou foi movido.</p>
      <a href="./criar" class="btn btn-primary">Voltar para a Página Inicial</a>
    </div>
  </main>

  <footer>
    <p>Encurtador de Links &bull; Criado por <a href="https://github.com/dougretrogames" target="_blank" rel="noopener noreferrer"><strong>Doug Retro Games</strong></a></p>
  </footer>
</body>
</html>
