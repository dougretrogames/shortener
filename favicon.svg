<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="discGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#0f233f" />
      <stop offset="70%" stop-color="#0b1a2e" />
      <stop offset="100%" stop-color="#07101e" />
    </radialGradient>
    <linearGradient id="lockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Dark Base -->
  <rect width="512" height="512" fill="#030712" rx="100" />

  <!-- Center Disc -->
  <circle cx="256" cy="256" r="216" fill="url(#discGrad)" />

  <!-- Lock Icon Group -->
  <g filter="url(#neonGlow)">
    <!-- Shackle (Arco Superior) -->
    <path d="M 198 232 V 190 C 198 158 224 132 256 132 C 288 132 314 158 314 190 V 232" 
          fill="none" 
          stroke="url(#lockGrad)" 
          stroke-width="30" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Lock Body (Corpo do Cadeado) -->
    <rect x="156" y="232" width="200" height="122" rx="32" ry="32" 
          fill="none" 
          stroke="url(#lockGrad)" 
          stroke-width="30" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>
